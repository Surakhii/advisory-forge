[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisory-forge"
version = "0.1.0"
description = "Scaffold, score, coordinate, and package vulnerability advisories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ayham Sarkhi" }]
keywords = ["security", "vulnerability", "advisory", "cvss", "disclosure"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.urls]
Specification = "https://www.first.org/cvss/"

[project.scripts]
forge = "advisory_forge.cli:main"

[tool.setuptools.packages.find]
include = ["advisory_forge*"]

[tool.setuptools.package-data]
advisory_forge = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
